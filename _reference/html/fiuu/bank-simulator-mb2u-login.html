<script>
  $(function(){
    $('#show-password').on('change', function() {
    const passwordField = $('#password');
    if ($(this).is(':checked')) {
      passwordField.attr('type', 'text');
    } else {
      passwordField.attr('type', 'password');
    }
    });

    $("#login-btn").click(function(event) {
        event.preventDefault();

        var user = $('#username').val();
        var pwd = $('#password').val();

        $.ajax({
            type    : "POST",
            url     : "https://bank-simulator.fiuu.com/MB2U0227/verify-login",
            data    : { u: user, p: pwd },
            cache   : false,
            dataType: 'json',
            success : function(data)
            {
                if(data.status == 1)
                {
                  $('#login_form').attr("action", "/MB2U0227/simulator");
                  $('#login_form').submit();
                }
                else
                {
                  Swal.fire({
                      icon: 'error',
                      title: 'Oops...',
                      text: 'Wrong username or password'
                  });
                  $('#username').val('');
                  $('#password').val('');
                  return false;
                }
            },
            beforeSend : function()
            {
                // loadingBody.block();
            },
            complete : function()
            {
                // loadingBody.release();
            },
            error: function()
            {
                alert('Action fail. Please refresh browser.');
            }
        });
    });
  });
</script>
