<script>
  $("#tac-btn").click(function() {
    var tacNum = Math.floor(100000 + Math.random() * 900000); // Generate 6-digit TAC
    document.getElementById('otp').value = tacNum; // Display TAC in the input field
    document.getElementById('pay-btn').style.display = "block"; // Show pay button
    document.getElementById('copybtn').style.display = "inline-block"; // Show copy button
    document.getElementById('tac-btn').style.display = "none"; // Hide the "Request TAC" button
  });

  $("#status_code").on('change', function() {
    $('input[name="fpx_debitAuthCode"]').val(this.value);
    $('input[name="fpx_creditAuthCode"]').val(this.value);
    $('input[name="statusChanged"]').val("true");
  });

  function CopyToClipboard(id) {
    var r = document.createRange();
    r.selectNode(document.getElementById(id));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    document.execCommand('copy');
    window.getSelection().removeAllRanges();

    // Visual feedback logic
    const copyButton = document.getElementById('copybtn');

    // Add copied effect
    copyButton.classList.add('copied');

    // Remove effect after 2 seconds
    setTimeout(() => {
        copyButton.classList.remove('copied');
    }, 2000);
  }
</script>
