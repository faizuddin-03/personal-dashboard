.clr{font-size:17px;color:#1a73e8;cursor:pointer;margin-left:16px}

table{border-collapse:collapse;min-width:2050px;width:100%}

function money(n){return 'RM'+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function toDate(s){if(!s||s==='-')return null;var p=s.split(' ')[0].split('-');return new Date(+p[2],+p[1]-1,+p[0]);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

// --- filter widgets
function renderFld(el){
 var f=el.dataset.f,sel=F[f],multi=!!el.dataset.multi,h='';
 if(sel.length){h+='<span class="lb">'+el.dataset.label+'</span><div class="chips">'+sel.map(function(v){return '<span class="chip">'+(multi?'<b data-x="'+esc(v)+'">×</b>':'')+esc(v)+'</span>';}).join('')+'</div>';}
 else h+='<span class="ph">'+el.dataset.label+'</span>';
 h+='<span class="car"></span><div class="dd">'+OPT[f].map(function(o){return '<div data-o="'+esc(o)+'" class="'+(sel.indexOf(o)>-1?'sel':'')+'">'+esc(o)+'</div>';}).join('')+'</div>';
 el.innerHTML=h;
}
function renderAll(){document.querySelectorAll('.fld').forEach(renderFld);}
document.addEventListener('click',function(e){
 var x=e.target.closest('[data-x]');
 if(x){var el=x.closest('.fld');F[el.dataset.f]=F[el.dataset.f].filter(function(v){return v!==x.dataset.x;});renderFld(el);e.stopPropagation();return;}
 var o=e.target.closest('[data-o]');
 if(o){var el2=o.closest('.fld'),f=el2.dataset.f,v=o.dataset.o;
  if(el2.dataset.multi){var i=F[f].indexOf(v);if(i>-1)F[f].splice(i,1);else F[f].push(v);}
  else F[f]=(F[f][0]===v)?[]:[v];
  renderFld(el2);el2.classList.add('open');return;}
 var fld=e.target.closest('.fld');
 document.querySelectorAll('.fld.open').forEach(function(d){if(d!==fld)d.classList.remove('open');});
 if(fld)fld.classList.toggle('open');
 var tl=e.target.closest('[data-tx]');
 if(tl){e.preventDefault();showDetail(tl.dataset.tx);}
 var rb=e.target.closest('[data-rc]');if(rb){showReceipt(rb.dataset.rc);return;}
 if(e.target.closest('[data-close]')){document.getElementById('ov').remove();return;}
 if(e.target.closest('[data-print]')){window.print();return;}
 if(e.target.closest('#backlink')){e.preventDefault();showList();}
});

function match(t){
 if(F.platform.length){var ok=F.platform.some(function(p){return p==='Secarang'?(t.plat==='Secarang'||t.plat==='Secarang-MK'):p==='Secarang only'?t.plat==='Secarang':t.plat===p;});if(!ok)return false;}
 if(F.insurer.length&&F.insurer.indexOf(t.ins)<0)return false;
 if(F.status.length&&F.status.indexOf(t.st)<0)return false;
 if(F.jpj.length&&F.jpj.indexOf(t.jpj)<0)return false;
 if(F.roadTax.length&&t.rt!==F.roadTax[0])return false;
 if(F.discount.length&&F.discount.indexOf(t.disc)<0)return false;
 var fr=document.getElementById('from').value,ti=document.getElementById('till').value;
 if(fr||ti){var d=toDate(F.dateType[0]==='Insurance Creation Date'?t.ic:t.tc);if(!d)return false;
  if(fr&&d<new Date(fr+'T00:00'))return false;if(ti&&d>new Date(ti+'T23:59'))return false;}
 var q=document.getElementById('q').value.trim().toLowerCase();
 if(q&&[t.id,t.veh,t.name,t.idno].join(' ').toLowerCase().indexOf(q)<0)return false;
 return true;
}
function renderRows(){
 var list=T.filter(match),b=document.getElementById('rows');
 if(!list.length){b.innerHTML='<tr><td colspan="17" class="empty">No record found</td></tr>';return;}
 b.innerHTML=list.map(function(t,i){
  return '<tr><td>'+(i+1)+'</td><td><a data-tx="'+t.id+'" href="#">'+t.id+'</a><br><span class="pb">'+(t.plat==='eAuto'?'eAuto':t.plat==='Secarang-MK'?'Secarang-MK':'Secarang')+'</span></td><td>'+t.tc+'</td><td>'+t.ic+'</td><td>'+t.ucd+'</td><td>'+t.ucdn+'</td><td>'+t.veh+'</td><td>'+t.type+'</td><td>'+t.name+'<br>'+t.idno+'</td><td>'+money(t.amt)+(t.paid?'<span class="paid">Paid</span><br>'+t.paidAt:'<span class="unpaid">Unpaid</span>')+'</td><td>'+t.mode+'</td><td>'+(t.disc||'')+'</td><td>'+(t.rt||'')+'</td><td>'+t.ins+'<br><span class="sub">Serba Sentral</span></td><td>'+t.st+'</td><td>'+t.jpj+'</td><td></td></tr>';
 }).join('');
}
