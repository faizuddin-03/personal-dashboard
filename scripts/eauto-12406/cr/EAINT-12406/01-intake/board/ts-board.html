<title>EAINT-12406 Test Scenarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an execution console. Summary line and sheet chips on top, one filter bar, then a split:
   the test scenario list on the left, the open test scenario on the right with a result dock pinned
   to its bottom so the steps, the expected result and the result buttons are always on screen together. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --raise:#f6f8fb; --ink:#141a24; --muted:#5b6678; --faint:#8a94a6; --line:#dbe0e8; --line2:#c9d0dc;
  --accent:#3445c2; --accent-ink:#ffffff; --sel:#e9ecff; --focus:#5a6cf0; --track:#e1e6ee;
  --pass:#1b7a42; --pass-bg:#e1f3e8; --fail:#b8261b; --fail-bg:#fde6e3; --rerun:#975a00; --rerun-bg:#fcefd6;
  --kiv:#5a47a6; --kiv-bg:#ece8fa; --blocked:#7a5c12; --blocked-bg:#f5eed8; --miss:#8c3b6a; --miss-bg:#f8e5ef;
  --na:#5b6678; --na-bg:#e8ecf1; --dep:#ffffff; --dep-bg:#15181d; --none:#5b6678; --none-bg:#eef1f5;
  --mark:#c48a00; --mark-bg:#fff3c8; --warn:#975a00; --warn-bg:#fcefd6; --info:#1d4f9a; --info-bg:#e3edfc;
  --shadow:0 10px 30px rgba(18,26,40,.16);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --panel:#151b25; --raise:#1a2130; --ink:#e5e9f0; --muted:#97a2b5; --faint:#6f7a8d; --line:#253041; --line2:#33405a;
  --accent:#8c9cff; --accent-ink:#0d1220; --sel:#1f2846; --focus:#9fadff; --track:#243044;
  --pass:#6fd394; --pass-bg:#16331f; --fail:#ff8b7e; --fail-bg:#3b1b18; --rerun:#f1b85b; --rerun-bg:#3a2b12;
  --kiv:#b6a7f3; --kiv-bg:#2a2445; --blocked:#e2c477; --blocked-bg:#342c16; --miss:#eaa5ca; --miss-bg:#3a1e2e;
  --na:#97a2b5; --na-bg:#212b3a; --dep:#ffffff; --dep-bg:#000000; --none:#97a2b5; --none-bg:#1d2533;
  --mark:#f0c24a; --mark-bg:#3c3213; --warn:#f1b85b; --warn-bg:#3a2b12; --info:#90b8ff; --info-bg:#1a2a45;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --panel:#151b25; --raise:#1a2130; --ink:#e5e9f0; --muted:#97a2b5; --faint:#6f7a8d; --line:#253041; --line2:#33405a;
  --accent:#8c9cff; --accent-ink:#0d1220; --sel:#1f2846; --focus:#9fadff; --track:#243044;
  --pass:#6fd394; --pass-bg:#16331f; --fail:#ff8b7e; --fail-bg:#3b1b18; --rerun:#f1b85b; --rerun-bg:#3a2b12;
  --kiv:#b6a7f3; --kiv-bg:#2a2445; --blocked:#e2c477; --blocked-bg:#342c16; --miss:#eaa5ca; --miss-bg:#3a1e2e;
  --na:#97a2b5; --na-bg:#212b3a; --dep:#ffffff; --dep-bg:#000000; --none:#97a2b5; --none-bg:#1d2533;
  --mark:#f0c24a; --mark-bg:#3c3213; --warn:#f1b85b; --warn-bg:#3a2b12; --info:#90b8ff; --info-bg:#1a2a45;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);padding-inline:16px;padding-block:0;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px}
textarea{width:100%;resize:vertical;line-height:1.45;min-height:56px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:400}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---- top ---- */
/* header: row 1 = which ticket (title cut to fit, full on hover) + page controls; row 2 = progress */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 360px}
.brand .sub{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.stg{flex:none;font-size:11.5px;font-weight:700;color:var(--info);background:var(--info-bg);border-radius:4px;padding:0 7px;white-space:nowrap}
.brand h1{font-size:18px;font-weight:700;white-space:nowrap}
.brand .tk{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.trial{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 7px}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;flex:1 1 100%;min-width:0}
.summary .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.summary .big small{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
.summary .sbar{width:180px;height:10px;border-radius:5px}
/* history: the reason under a non-pass result, and a pass that follows a fail */
.hist .rwhy{font-size:13px;line-height:1.45;white-space:pre-wrap;border-left:3px solid var(--line2);background:var(--raise);padding:4px 9px;border-radius:0 6px 6px 0;margin-top:3px;max-width:78ch}
.hist .rwhy b{font-weight:700}
.hist .rwhy.k-FAIL,.hist .rwhy.k-EVIDENCE-MISSING{border-color:var(--fail);background:var(--fail-bg)}
.hist .rwhy.k-KIV{border-color:var(--kiv);background:var(--kiv-bg)}
.hist .rwhy.k-BLOCKED{border-color:var(--blocked);background:var(--blocked-bg)}
.hist .rwhy.k-RE-RUN{border-color:var(--rerun);background:var(--rerun-bg)}
.hist .rwhy.k-DEPRIORITIZED{border-color:var(--dep-bg);background:var(--raise)}
.depwhy{border-left:3px solid var(--dep-bg)!important;background:var(--raise)!important;border-radius:0 6px 6px 0!important;margin-left:0!important}
.hist .rwhy.none{font-style:italic;color:var(--muted)}
.hist .h2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;max-width:78ch}
.hist .h2.open{display:block}
.fixchip{display:inline-block;background:var(--pass-bg);color:var(--pass);font-size:11.5px;font-weight:700;border-radius:4px;padding:0 7px}
.reason{display:grid;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--panel)}
.reason label{font-size:12.5px;font-weight:700}
.reason textarea{min-height:58px;font-size:13px}
.reason .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.summary .txt{font-size:13px;color:var(--muted);min-width:0}
.summary .txt b{color:var(--ink)}
.summary .txt .w{color:var(--warn);font-weight:700}
.sbar{width:140px;height:8px;border-radius:4px;background:var(--track);display:flex;gap:1px;overflow:hidden;flex:none}
.sbar i{display:block;height:100%}
.meta{display:flex;align-items:center;gap:10px;margin-left:auto}
.build{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line2);border-radius:6px;padding:3px 9px;font-size:12.5px;background:none}
.build b{font-family:var(--mono);font-weight:600;font-size:12px}
.build.unset{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--pass)}

/* ---- sheet chips (the one way to pick a sheet) ---- */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;display:grid;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px 6px;text-align:left;min-width:96px}
.chip .nm{font-size:12.5px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.chip .nm span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.chip .mini{height:4px;border-radius:2px;background:var(--track);display:flex;overflow:hidden}
.chip .mini i{display:block;height:100%}
.chip[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-selected="true"] .nm{color:var(--accent)}

/* ---- filter bar (the one way to filter) / bulk bar ---- */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.fbar input[type=search]{flex:1 1 220px;min-width:0;padding:6px 10px}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px}
.fbtn.on{border-color:var(--accent);background:var(--sel);color:var(--accent);font-weight:700}
.fbtn .x{border:0;background:none;padding:0 0 0 2px;font-size:14px;line-height:1;color:inherit}
.fbtn::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid currentColor;opacity:.6}
.fbtn.noarrow::after{display:none}
.shown{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sel);border:1px solid var(--accent);border-radius:8px;padding:5px 10px;width:100%}
.bulk b{color:var(--accent)}

/* ---- split ---- */
body > .top,body > .rail,body > .fbar,body > .banner{flex:none}
/* list | drag handle | open TS; --listw is the list's share, set by dragging the handle and kept per viewer */
.split{--listw:46%;flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(260px,var(--listw)) 14px minmax(360px,1fr);gap:0;padding-bottom:12px}
.split.full{grid-template-columns:minmax(0,1fr)}
.split.full .gutter{display:none}
.gutter{cursor:col-resize;display:grid;place-items:center;touch-action:none;border-radius:6px}
.gutter::before{content:"";width:4px;height:44px;border-radius:2px;background:var(--line2);transition:background .15s}
.gutter:hover::before,.gutter:focus-visible::before,.gutter.drag::before{background:var(--accent)}
.split.dragging{cursor:col-resize;user-select:none}
.split.dragging iframe,.split.dragging video{pointer-events:none}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}
.listpane{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;z-index:2;background:var(--raise);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
thead tr.grp th{top:0;text-align:center;border-bottom:1px dashed var(--line2);color:var(--faint);font-size:10.5px}
thead tr.grp + tr th{top:27px}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raise)}
tr.row.sel td{background:var(--sel)}
tr.row.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.gh td{background:var(--bg);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 9px}
tr.gh td span{font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px;font-variant-numeric:tabular-nums}
td.ck,th.ck{width:30px;padding-right:0}
td.ck input,th.ck input{width:15px;height:15px;margin:2px 0 0;accent-color:var(--accent)}
td.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.short{white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.empty-cell{color:var(--faint)}
.lbl{display:inline-block;margin-left:5px;padding:0 5px;border-radius:4px;font:700 10px/16px var(--font);letter-spacing:.04em;vertical-align:1px;background:var(--track);color:var(--ink)}
.lbl.SIT{background:#c8261b;color:#fff}
.res{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.r-PASS{background:var(--pass-bg);color:var(--pass)} .r-FAIL{background:var(--fail-bg);color:var(--fail)}
.r-RE-RUN{background:var(--rerun-bg);color:var(--rerun)} .r-KIV{background:var(--kiv-bg);color:var(--kiv)}
.r-BLOCKED{background:var(--blocked-bg);color:var(--blocked)} .r-EVIDENCE-MISSING{background:var(--miss-bg);color:var(--miss)}
.r-N-A{background:var(--na-bg);color:var(--na)} .r-DEPRIORITIZED{background:var(--dep-bg);color:var(--dep)} .r-none{background:var(--none-bg);color:var(--none);border:1px dashed var(--line2)}
.c-PASS{background:var(--pass)} .c-FAIL{background:var(--fail)} .c-RE-RUN{background:var(--rerun)} .c-KIV{background:var(--kiv)}
.c-BLOCKED{background:var(--blocked)} .c-EVIDENCE-MISSING{background:var(--miss)} .c-N-A{background:var(--na)}
.flag{display:inline-block;margin-left:5px;font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}
.tick{color:var(--pass);font-weight:700;margin-left:4px}
.prio{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);border-radius:4px;padding:0 6px;background:none}
.prio.P1{color:var(--fail);border-color:var(--fail)}
.emptybox{padding:48px 20px;text-align:center;color:var(--muted)}

/* ---- detail pane ---- */
.detail{display:flex;flex-direction:column;overflow:hidden}
.dhead{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.dhead{min-width:0}
.dhead .r1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.dhead .r1 .id{font-family:var(--mono);font-weight:600;font-size:14px}
.dhead .nav{margin-left:auto;display:flex;gap:4px}
.dhead .crumb{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dhead h2{font-size:16.5px;line-height:1.35}
/* where the open TS stands, one line: result, who and when, evidence, review, defect */
.dhead .ttl{overflow-wrap:anywhere;font-size:15.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;max-width:80ch}
.dhead .ttl.open{display:block}
.btn.mini{font-size:12px;padding:1px 7px}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px}
.res.big{font-size:13px;padding:2px 10px}
.schip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
button.schip:hover{border-color:var(--accent)}
.schip.ok{border-color:transparent;background:var(--pass-bg);color:var(--pass)}
.schip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.schip.none{border-style:dashed;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:2px;margin:4px -16px -10px;padding:0 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 10px 7px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab span{font-weight:400;font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--track);color:var(--ink);border-radius:999px;padding:0 6px}
.revbox{border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:8px 10px;gap:2px}
.revbox .muted{font-size:12px}
.rbtn.more{background:var(--panel);color:var(--ink)}
.help{display:grid;gap:8px;padding:2px 8px 8px;font-size:13px;line-height:1.5}
.help p{margin:0}
.revact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ptblock{display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.sec > .ptblock:first-of-type{border-top:0;padding-top:0}
.pthead{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:4px 8px;align-items:baseline;font-size:13px;line-height:1.45;max-width:90ch}
.pthead.other{display:flex;flex-wrap:wrap}
.pthead .pid{flex:none;font-size:12px;font-weight:600;color:var(--accent);min-width:2.4em}
.noshot{font-size:12.5px}
.back{display:none}
.dbody{flex:1;overflow:auto;padding:12px 16px 18px;display:grid;gap:16px;align-content:start}
.sec{display:grid;gap:6px;min-width:0}
.sec > h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.sec > h3 .key{display:inline-flex;gap:10px;text-transform:none;letter-spacing:0;font-weight:400;font-size:11px}
.sec > h3 .key i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.sec > h3 .act{margin-left:auto;text-transform:none;letter-spacing:0}
/* label | value rows: a fixed label column and top alignment, so every label sits level with the first line of its value */
.kv{display:grid;grid-template-columns:minmax(120px,30%) minmax(0,1fr);gap:8px 16px;align-items:start}
.kv .k{font-size:12.5px;color:var(--muted);line-height:1.45;padding-top:1px}
.kv .v{min-width:0}
.kv .v.txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.txtview{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.sec > h3 .act + .act{margin-left:0}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr);gap:2px}.kv .v{margin-bottom:6px}}
.kv .g{grid-column:1/-1;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-top:4px}
.fld{width:100%;border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;margin-left:-6px;text-align:left;white-space:pre-wrap;min-height:24px}
.fld:hover,.fld:focus{border-color:var(--line2);background:var(--panel)}
textarea.fld{min-height:28px;resize:vertical}
.fld::placeholder{color:var(--faint);font-style:italic}
.stepview{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;gap:1px;line-height:1.45}
.stepview .sl{white-space:pre-wrap;border-radius:4px;padding:1px 5px}
.stepview .sl.common{color:var(--muted)}
.stepview .sl.trig{background:var(--mark-bg);box-shadow:inset 3px 0 0 var(--mark);font-weight:700}
.stepview.exp .sl.trig{background:var(--pass-bg);box-shadow:inset 3px 0 0 var(--pass)}
.dfct{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dchip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700;text-decoration:none;font-family:var(--mono);white-space:nowrap}
.d-done{background:var(--pass-bg);color:var(--pass)} .d-prog{background:var(--info-bg);color:var(--info)} .d-todo{background:var(--none-bg);color:var(--none)}
.d-reopen{background:var(--fail-bg);color:var(--fail)} .d-neutral{background:var(--track);color:var(--ink)} .d-warn{background:var(--warn-bg);color:var(--warn);font-family:var(--font)}
.why{white-space:pre-wrap;font-size:13px;max-width:80ch}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.hist li{position:relative;padding:4px 0 10px 16px;display:grid;gap:2px}
.hist li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--line2)}
.hist li.latest::before{border-color:var(--accent);background:var(--accent)}
.hist .h1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.hist .h1 time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.hist .h2{font-size:12.5px;color:var(--muted)}
.hist a{color:var(--accent)}
.rev{display:flex;align-items:center;gap:10px;font-size:13px}
.rev input{width:16px;height:16px;accent-color:var(--accent)}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.pts li{display:flex;gap:8px;align-items:baseline;white-space:pre-wrap;line-height:1.45}
.pts .pid{flex:none;font-size:12px;font-weight:600;color:var(--accent);min-width:2.4em}
/* evidence on the board: the screenshots and small copies of the videos are published next to this page
   (ev/<TS>/…, automation/scripts/board-evidence-pack.py) and listed in cases/<TS>.evidenceSet */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.evth{display:grid;gap:3px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:4px;text-align:left;min-width:0}
.evth:hover{border-color:var(--accent)}
.evth img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:5px;background:var(--track)}
.evth .cap{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;min-width:0}
.evth .cap span:last-child{overflow:hidden;text-overflow:ellipsis}
.evpt{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px;background:var(--pass-bg);color:var(--pass)}
.evpt.bad{background:var(--fail-bg);color:var(--fail)}
.evvids{display:grid;gap:6px}
.evvids details{border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:5px 9px}
.evvids summary{cursor:pointer;font-size:13px;font-weight:700}
.evvids summary span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.evvids video{display:block;width:100%;margin-top:6px;border-radius:6px;background:#000}
.evpath{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;font-size:12px;color:var(--muted)}
.evpath .mono{font-size:11.5px;word-break:break-all}
.ptshot{border:0;background:none;padding:0 2px;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
/* screenshot viewer: dark in both themes, like any photo viewer */
.lb{position:fixed;inset:0;z-index:60;background:#0b0e14;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#e5e9f0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .lbtop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 16px;font-size:13px}
.lb .lbtop b{font-family:var(--mono);font-weight:600;word-break:break-all}
.lb .lbtop .sp{margin-left:auto;display:flex;gap:6px}
.lb button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.lb button:disabled{opacity:.35;cursor:default}
.lb .stage{min-height:0;overflow:auto;display:grid;place-items:center;padding:0 16px}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;background:#fff}
.lb .stage.zoom{place-items:start center}
.lb .stage.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.lb .lbcap{padding:10px 16px 14px;font-size:13px;display:grid;gap:8px;max-height:32vh;overflow:auto}
.lb .lbcap .pr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;max-width:120ch}
.lb .lbcap .k{color:#97a2b5}
.lb .lbcap .evpt{background:#16331f;color:#6fd394;justify-self:start}
.lb .lbcap .evpt.bad{background:#3b1b18;color:#ff8b7e}

/* result dock, pinned to the bottom of the detail pane */
.dock{border-top:1px solid var(--line);background:var(--raise);padding:10px 16px 12px;display:grid;gap:8px}
.dock .now{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtns{display:flex;flex-wrap:wrap;gap:5px}
.rbtn{border:1px solid var(--line2);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700}
.rbtn:hover{filter:brightness(.97)}
.rbtn[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-1px}
.rbtn.r-PASS,.rbtn.r-FAIL,.rbtn.r-RE-RUN,.rbtn.r-KIV,.rbtn.r-BLOCKED,.rbtn.r-EVIDENCE-MISSING,.rbtn.r-N-A,.rbtn.r-DEPRIORITIZED{border-color:transparent}
.dock .row2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px}
.dock .row2 label{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.dock .row2 input,.dock .row2 select{padding:3px 7px;font-size:12.5px}
.dock .row2 input.bld{width:170px}
.dock .extra{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dock .extra input{width:100%;font-size:12.5px;padding:4px 7px}

/* popover, toast */
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;min-width:200px;max-width:min(92vw,420px);max-height:70vh;overflow:auto}
.pop .hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 8px 2px}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:6px;padding:6px 8px;text-align:left;font-size:13px}
.pop .opt:hover,.pop .opt:focus-visible{background:var(--raise)}
.pop label.opt{cursor:pointer}
.pop .sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.pop .frm{display:grid;gap:6px;padding:6px 8px;border-top:1px solid var(--line);margin-top:4px}
.pop .frm .r{display:flex;gap:6px;align-items:center}
.pop .frm input,.pop .frm textarea{width:100%;font-size:13px;padding:4px 7px;min-height:0}
.colrow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;padding:3px 8px}
.colrow input[type=text]{font-size:12.5px;padding:3px 6px;min-width:0}
.colrow .g{font-size:11px;color:var(--faint);grid-column:2/-1;margin-top:-4px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.toast.err{background:var(--fail);color:#fff}
.banner{padding:7px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:8px}

/* questions + defects views */
.tview{padding:14px 16px;display:grid;gap:12px;align-content:start}
.tview h2{font-size:16px}
.tview p{margin:0;color:var(--muted);font-size:13px;max-width:80ch}
.tview .tbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tview table{min-width:720px}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.queue li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.link{border:0;background:none;padding:0;color:var(--accent);font-family:var(--mono);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

@media (max-width:920px){
  body{overflow:auto;height:auto;display:block}
  html{height:auto}
  .split{display:block}
  .gutter{display:none}
  .listpane{overflow:visible}
  .detail{position:fixed;inset:0;z-index:30;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .back{display:inline-flex}
  /* on a phone the open TS covers the list only after a tap; ‹ List closes it again */
  .detail:not(.mopen){display:none}
  .summary{flex-basis:100%}
  .meta{margin-left:0}
  .dock .extra{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- compact header (27.10, Azfar: the video and the steps need the room) ---- */
.top{padding-block:8px 4px;gap:4px 14px}
.brand{flex:1 1 300px}.brand h1{font-size:16px}.brand .tk{white-space:nowrap}.brand .sub{max-width:56ch}

.dhead .ttl{font-size:13.5px;line-height:1.35;font-weight:600}
.strip{font-size:12px;gap:4px 6px}.res.big{font-size:12px;padding:1px 9px}.schip{font-size:11.5px;padding:0 8px}
.tabs{margin:2px -14px -6px;padding:0 10px}.tab{padding:6px 9px 5px;font-size:12.5px}
.dock{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;padding:6px 14px 7px}
.dock .now span{display:none}.dock .now b{font-size:12.5px}.dock .extra{flex:1 1 100%}.dock .row2 input.bld{width:140px}.rbtn{padding:3px 8px;font-size:12px}

<header class="top">
  <div class="brand"><h1>Test Scenarios</h1><span class="tk" id="tkId"></span><span class="stg" id="tkStg" hidden></span><span class="muted sub" id="tkSub"></span></div>
  <div class="meta">
    <button class="build" id="buildBtn" type="button" title="The build being tested. Every result you record is stamped with it.">Build <b id="buildVal">not set</b></button>
    <button class="btn ghost" id="helpBtn" type="button">How this page works</button>
    <span class="live"><span class="dot" id="dot"></span><span id="liveText">Connecting</span></span>
  </div>
  <div class="summary" id="summary" aria-live="polite"></div>
</header>
<nav class="rail" id="rail" role="tablist" aria-label="Sheets"></nav>
<div class="banner" id="banner" hidden></div>
<div class="fbar" id="fbar">
  <input type="search" id="q" placeholder="Search TS No, scenario, test data, steps, expected, remarks, ticket" aria-label="Search">
  <span id="fbtns" style="display:contents"></span>
  <button class="btn ghost" id="clearAll" type="button" hidden>Clear filters</button>
  <button class="btn" id="colsBtn" type="button" hidden>Columns</button>
  <button class="btn primary" id="addRow" type="button" hidden>Add test scenario</button>
  <span class="shown" id="shown"></span>
</div>
<div class="fbar" id="bulkbar" hidden><div class="bulk"><b id="bulkN"></b>
  <button class="fbtn" type="button" data-bulk="result">Set result</button>
  <button class="fbtn" type="button" data-bulk="qa">Set QA</button>
  <button class="fbtn" type="button" data-bulk="prio">Set priority</button>
  <button class="fbtn" type="button" data-bulk="labels">Label (e.g. SIT)</button>
  <button class="btn ghost" type="button" id="bulkClear">Clear selection</button>
  <span class="shown">Each result set here is added to that test scenario's history</span></div></div>
<main class="split" id="split">
  <section class="pane listpane" id="list" aria-label="Test scenarios"><div class="emptybox">Loading the test scenarios…</div></section>
  <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-label="Drag to make the list or the open test scenario wider. Double-click to reset." title="Drag to resize · double-click to reset" tabindex="0"></div>
  <section class="pane detail" id="detail" aria-label="Open test scenario">
    <div class="emptybox" id="dEmpty">Pick a test scenario on the left. Its steps, expected result and history open here, with the result buttons at the bottom.<br><br><span class="muted">Keys: J / K or ↓ / ↑ move through the list.</span></div>
    <div class="dhead" id="dhead" hidden></div>
    <div class="dbody" id="dbody" hidden></div>
    <div class="dock" id="dock" hidden></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- constants ---------------- */
const RESULTS=["PASS","FAIL","RE-RUN","KIV","BLOCKED","EVIDENCE MISSING","N/A","DEPRIORITIZED",""];
const BAR=["PASS","FAIL","RE-RUN","KIV","BLOCKED","EVIDENCE MISSING","N/A"];
const CORE=new Set(["situation","setup","steps","expected"]);
/* ticket, title, instance, QA names, labels: settings/board (written by Claude when the board is created) */
let QA_LIST=[];
const JIRA="https://mfservices.atlassian.net/browse/";
const FAILISH=new Set(["FAIL","EVIDENCE MISSING"]);
const SETTLED=new Set(["fixed, retest","question","not a defect"]);
const DSTATES=[["raised","Ticket raised"],["not raised","Not yet raised"],["fixed, retest","Fixed, retest"],["question","Question to SA/BA"],["not a defect","Not a defect"]];

/* ---------------- state ---------------- */
const st={cases:new Map(),sheets:new Map(),oqs:new Map(),tickets:new Map(),settings:{},td:new Map(),
  view:"ALL",sel:null,checked:new Set(),f:{result:[],qa:"",prio:"",defect:"",reviewed:""},
  runs:[],runsFor:null,runsUnsub:null,db:null,user:null,uid:null,canWrite:true,live:false,names:{},
  editText:new Set(),dockExtra:false,dockQa:"",mobileOpen:false,evOpen:new Set(),lb:null,tab:"test",ttlOpen:false,bodyKey:""};
const store={get(k,d){try{const v=localStorage.getItem("tc."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("tc."+k,JSON.stringify(v))}catch(e){}}};
st.view=store.get("view","ALL");st.tab=store.get("tab","test");st.f=Object.assign(st.f,store.get("f",{}));st.sel=store.get("sel",null);
try{const h=decodeURIComponent((location.hash||"").slice(1));if(/^[A-Za-z0-9._~-]+$/.test(h))st.sel=h}catch(e){}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rk=r=>r?r.replace(/[^A-Z]+/gi,"-").replace(/-$/,""):"none";
const rl=r=>r||"Not run";
const num=id=>{const m=/(\d+)$/.exec(id||"");return m?+m[1]:0};
const fmt=t=>{if(!t)return"";const d=new Date(t);return isNaN(d)?"":d.toLocaleString([],{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
const sheetList=()=>[...st.sheets.values()].sort((a,b)=>(a.order??99)-(b.order??99));
const sheetOf=k=>st.sheets.get(k);
const defOf=c=>(c.defect&&typeof c.defect==="object")?c.defect:null;
const tix=c=>{const d=defOf(c);return Array.isArray(d&&d.tickets)?d.tickets.filter(t=>t&&t.key):[]};
const needsTicket=c=>FAILISH.has(c.result)&&!tix(c).length&&!(defOf(c)&&SETTLED.has(defOf(c).state));
const labels=c=>Array.isArray(c.labels)?c.labels.filter(Boolean).map(String):[];
const lblHtml=c=>labels(c).map(l=>`<span class="lbl ${esc(l.replace(/[^A-Za-z0-9]/g,""))}" title="${l==="SIT"?esc(((st.settings.labelHints||{})[l])||l):esc(((st.settings.labelHints||{})[l])||l)}">${esc(l)}</span>`).join("");
const who=id=>id?(st.names[id]||"Someone"):"";
const stCls=s=>{s=String(s||"").toLowerCase();if(/done|closed|resolved|complete/.test(s))return"d-done";if(/reopen/.test(s))return"d-reopen";if(/progress|review|testing|dev|ready/.test(s))return"d-prog";if(/to do|open|backlog|new/.test(s))return"d-todo";return"d-neutral"};
const qaNames=()=>[...new Set([...QA_LIST,...[...st.cases.values()].map(c=>c.qa).filter(Boolean)])];

function tally(list){const n={};list.forEach(c=>{const k=c.result||"none";n[k]=(n[k]||0)+1});
  const dep=n.DEPRIORITIZED||0,total=list.length-dep,passed=n.PASS||0;
  return{n,dep,total,passed,pct:total?Math.round(passed/total*100):0,noTicket:list.filter(needsTicket).length}}
const barHtml=t=>BAR.filter(k=>t.n[k]).map(k=>`<i class="c-${rk(k)}" style="width:${t.n[k]/Math.max(1,t.total)*100}%" title="${esc(k)}: ${t.n[k]}"></i>`).join("");

/* ---------------- filtering (one place) ---------------- */
function visible(){
  const q=$("#q").value.trim().toLowerCase(),f=st.f;
  const inSheet=st.view==="ALL"||st.view==="OQ"||st.view==="DEF"?null:st.view;
  return [...st.cases.values()].filter(c=>
    (!inSheet||c.sheet===inSheet)&&
    (!f.result.length||f.result.includes(c.result||""))&&
    (!f.qa||(f.qa==="-"?!c.qa:c.qa===f.qa))&&(!f.prio||c.priority===f.prio)&&
    (!f.reviewed||(f.reviewed==="1")===!!c.reviewed)&&
    (!f.defect||(f.defect==="needs"?needsTicket(c):f.defect==="raised"?tix(c).length>0:(defOf(c)||{}).state===f.defect))&&
    (!q||searchText(c).includes(q))
  ).sort((a,b)=>((sheetOf(a.sheet)||{}).order??99)-((sheetOf(b.sheet)||{}).order??99)||(a.order??1e9)-(b.order??1e9)||num(a.id)-num(b.id));
}
function searchText(c){
  const sh=sheetOf(c.sheet),extra=sh?(sh.columns||[]).map(col=>fv(c,col.field)).join(" "):"";
  return [c.id,labels(c).join(" "),c.situation,c.setup,c.steps,c.expected,c.remarks,c.deprio,c.section,extra,tix(c).map(t=>t.key).join(" "),(defOf(c)||{}).why].join(" ").toLowerCase();
}

/* ---------------- top ---------------- */
function renderTop(){
  const S=st.settings;QA_LIST=Array.isArray(S.qa)?S.qa:[];
  $("#tkId").textContent=S.ticket||"";$("#tkSub").textContent=S.title||"";$("#tkSub").title=S.title||"";
  $("#tkStg").textContent=S.instance?`staging /${S.instance}/`:"";$("#tkStg").hidden=!S.instance;
  document.title=S.ticket?`${S.ticket} Test Scenarios`:"Test Scenarios";
  const scope=st.view==="ALL"||st.view==="OQ"||st.view==="DEF"?[...st.cases.values()]:[...st.cases.values()].filter(c=>c.sheet===st.view);
  const t=tally(scope),sh=sheetOf(st.view);
  const parts=[];
  const rvAll=scope.filter(reviewable),rvDone=rvAll.filter(c=>c.reviewed).length;
  if(rvAll.length)parts.push(`<b>${rvDone}</b> of ${rvAll.length} reviewed`);
  if(t.n.FAIL)parts.push(`<b>${t.n.FAIL}</b> failed`);
  ["RE-RUN","KIV","BLOCKED","EVIDENCE MISSING"].forEach(k=>{if(t.n[k])parts.push(`<b>${t.n[k]}</b> ${k==="EVIDENCE MISSING"?"evidence missing":k}`)});
  if(t.n.none)parts.push(`<b>${t.n.none}</b> not run`);
  if(t.noTicket)parts.push(`<span class="w">${t.noTicket} failed with no ticket</span>`);
  if(t.dep)parts.push(`${t.dep} deprioritised (left out)`);
  $("#summary").innerHTML=st.cases.size?`<span class="big">${t.pct}%<small>${t.passed} / ${t.total} passed</small></span><span class="sbar" aria-hidden="true">${barHtml(t)}</span><span class="txt">${sh?esc(sh.name)+": ":""}${parts.join(" · ")||"nothing failed or open"}</span>`:"";
  const b=st.settings.build||"";$("#buildVal").textContent=b||"not set";$("#buildBtn").classList.toggle("unset",!b);
  const all=[...st.cases.values()],chips=[{key:"ALL",name:"All",n:all.length,t:tally(all)}];
  sheetList().forEach(s=>{const l=all.filter(c=>c.sheet===s.key);chips.push({key:s.key,name:s.name,n:l.length,t:tally(l),title:s.title})});
  const oqOpen=[...st.oqs.values()].filter(o=>!String(o.decision||"").trim()).length;
  chips.push({key:"OQ",name:"Open questions",n:`${oqOpen} open`},{key:"DEF",name:"Defects",n:`${st.tickets.size} tickets`});
  $("#rail").innerHTML=chips.map(c=>`<button class="chip" role="tab" type="button" data-view="${esc(c.key)}" aria-selected="${st.view===c.key}" ${c.title?`title="${esc(c.title)}"`:""}><span class="nm">${esc(c.name)}<span>${esc(c.n)}</span></span><span class="mini" aria-hidden="true">${c.t?barHtml(c.t):""}</span></button>`).join("");
}

function renderFilters(){
  const f=st.f;
  const btn=(k,label,val)=>`<button class="fbtn${val?" on":""}" type="button" data-filter="${k}">${esc(val?label+": "+val:label)}${val?`<span class="x" data-clear="${k}" role="button" aria-label="Clear ${esc(label)}">×</span>`:""}</button>`;
  const dlabel={needs:"Needs ticket",raised:"Ticket raised","fixed, retest":"Fixed, retest",question:"Question to SA/BA","not a defect":"Not a defect"};
  $("#fbtns").innerHTML=btn("result","Result",f.result.map(rl).join(", "))+btn("qa","QA",f.qa==="-"?"No QA":f.qa)+btn("prio","Priority",f.prio)+btn("defect","Defect",dlabel[f.defect]||"")+btn("reviewed","Reviewed",f.reviewed==="1"?"Yes":f.reviewed==="0"?"No":"");
  const any=f.result.length||f.qa||f.prio||f.defect||f.reviewed||$("#q").value;
  $("#clearAll").hidden=!any;

/* ---------------- runs (history) subscription: only the open TS ---------------- */
function watchRuns(){
  const id=st.sel;if(!st.db||!id||st.runsWatch===id)return;
  if(st.runsUnsub){try{st.runsUnsub()}catch(e){}st.runsUnsub=null}
  st.runsWatch=id;st.runs=[];st.runsFor=null;renderHistory();
  st.runsUnsub=st.db.collection("cases/"+id+"/runs").limit(500).onSnapshot(snap=>{
    if(st.runsWatch!==id)return;
    st.runs=snap.docs.map(d=>({...d.data(),_id:d.id})).sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
    st.runsFor=id;renderDetail();resolveNames(st.runs.map(r=>r.by));
  },()=>{st.runsFor=id;st.runs=[];renderHistory()});
}

/* ---------------- writes ---------------- */
const chains=new Map(),timers=new Map(),pending=new Map();
let toastT;function toast(t,err){const el=$("#toast");el.textContent=t;el.className="toast show"+(err?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>el.className="toast",err?4200:1800)}
function banner(t){const b=$("#banner");b.textContent=t;b.hidden=!t}
function write(path,data,label,retried){
  if(!st.db){toast("Not saved: not connected",true);return Promise.resolve()}
  const prev=chains.get(path)||Promise.resolve();
  const next=prev.then(()=>st.db.doc(path).update(data)).then(()=>{label&&toast("Saved · "+label)}).catch(e=>{
    const code=e&&e.code;
    if(code==="unavailable"&&!retried){return new Promise(r=>setTimeout(r,1200+Math.random()*900)).then(()=>write(path,data,label,true))}
    if(code==="not_granted"||code==="revoked"){st.canWrite=false;banner("You can view this page but not change it.");renderAll();return}
    toast("Not saved · "+(label||path)+" · "+(e&&e.message||"try again"),true);
  });
  chains.set(path,next);return next;
}
function stampCase(c,data){const now=new Date().toISOString();Object.assign(c,data,{updatedAt:now});if(st.uid)c.updatedBy=st.uid;return Object.assign({},data,{updatedAt:now},st.uid?{updatedBy:st.uid}:{})}
function setField(id,f,v,label){const c=st.cases.get(id);if(!c||(c[f]??"")===v)return;write("cases/"+id,stampCase(c,{[f]:v}),label||`${id} ${f}`)}
function queueField(id,f,v){const k=id+"|"+f;pending.set(k,v);clearTimeout(timers.get(k));timers.set(k,setTimeout(()=>flushField(k),800))}
function flushField(k){if(!pending.has(k))return;const v=pending.get(k);pending.delete(k);clearTimeout(timers.get(k));const [id,f]=k.split("|");if(CASE_F.has(f))setField(id,f,v);else setTD(id,f,v)}
function setTD(id,f,v){
  const had=st.td.has(id),cur=st.td.get(id)||{};if((cur[f]??"")===v||!st.db)return;
  const stamp={[f]:v,updatedAt:new Date().toISOString()};if(st.uid)stamp.updatedBy=st.uid;
  const next={...cur,...stamp};st.td.set(id,next);
  const path="testdata/"+id,prev=chains.get(path)||Promise.resolve();
  const p=prev.then(()=>had?st.db.doc(path).update(stamp):st.db.doc(path).set(next)).then(()=>toast(`Saved · ${id} ${f}`)).catch(e=>toast(`Not saved · ${id} ${f} · ${e&&e.message||"try again"}`,true));
  chains.set(path,p);
}
function flushAll(){[...pending.keys()].forEach(flushField)}
/* record a result: update the TS and append a run to its history */
function record(id,result,opt){
  const c=st.cases.get(id);if(!c||!st.db)return;opt=opt||{};
  const at=new Date().toISOString(),qa=opt.qa!=null?opt.qa:(c.qa||"");
  const run={result,qa,build:st.settings.build||"",at,prev:c.result||""};
  if(opt.evidence)run.evidence=opt.evidence;if(opt.note)run.note=opt.note;if(st.uid)run.by=st.uid;
  if(opt.reason)run.reason=opt.reason;
  if(FAILISH.has(result)&&tix(c).length)run.tickets=tix(c).map(t=>t.key);
  const data={result};if(qa!==(c.qa||""))data.qa=qa;
  /* the first written reason for a failure also fills the defect's "why it failed" */
  if(opt.reason&&FAILISH.has(result)&&!((defOf(c)||{}).why)){const d=defOf(c)||{};data.defect={...d,why:opt.reason,state:d.state||(tix(c).length?"raised":"not raised"),checked_on:at.slice(0,10)}}
  if(opt.reason&&result==="KIV"&&!c.kiv)data.kiv=opt.reason;
  if(opt.reason&&result==="DEPRIORITIZED")data.deprio=opt.reason;
  write("cases/"+id,stampCase(c,data),opt.quiet?"":`${id}: ${rl(result)} · added to history`);
  const rid=at.replace(/[^0-9]/g,"")+"-"+Math.random().toString(36).slice(2,7);
  st.db.collection("cases/"+id+"/runs").doc(rid).set(run).catch(e=>toast("History not saved for "+id+" · "+(e&&e.message||"try again"),true));
}

  if(st.user){try{st.uid=await st.user.id()}catch(e){}try{const w=await st.user.can("data.write");if(w===false){st.canWrite=false;banner("You can view this page but not change it.")}}catch(e){}}
  const dead=()=>{$("#dot").className="dot";$("#liveText").textContent="Connection lost · reload"};
  let raf=0;const later=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderAll()})};
  db.collection("sheets").limit(100).onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==="removed")st.sheets.delete(ch.doc.id);else st.sheets.set(ch.doc.id,{...ch.doc.data(),key:ch.doc.id})});later()},dead);
  db.collection("cases").limit(1000).onSnapshot(s=>{
    st.live=true;$("#dot").className="dot on";$("#liveText").textContent=s.metadata&&s.metadata.fromCache?"Syncing":"Live";
    /* an older "NOT RUN" value reads as Not run on screen; the stored value is left as it is */
    s.docChanges().forEach(ch=>{if(ch.type==="removed")st.cases.delete(ch.doc.id);else{const d={...ch.doc.data(),id:ch.doc.id};if(d.result==="NOT RUN")d.result="";st.cases.set(ch.doc.id,d)}});
    if(st.sel&&!st.cases.has(st.sel)&&s.docChanges().length>50)st.sel=null;
    later();if(st.sel)watchRuns();
  },dead);
  db.collection("questions").limit(500).onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==="removed")st.oqs.delete(ch.doc.id);else st.oqs.set(ch.doc.id,{...ch.doc.data(),id:ch.doc.id})});later()},()=>{});
  db.collection("tickets").limit(500).onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==="removed")st.tickets.delete(ch.doc.id);else{const d=ch.doc.data()||{};st.tickets.set(ch.doc.id,{...d,key:d.key||ch.doc.id})}});later()},()=>{});
  db.doc("settings/board").onSnapshot(s=>{st.settings=(s.exists&&s.data())||{};later()},()=>{});
  db.collection("testdata").limit(1000).onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==="removed")st.td.delete(ch.doc.id);else st.td.set(ch.doc.id,ch.doc.data()||{})});later()},()=>{});
})();
</script>
