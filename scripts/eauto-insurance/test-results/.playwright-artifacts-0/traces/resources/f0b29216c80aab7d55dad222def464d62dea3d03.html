<script>
/**
 * Dependencies:
 *
 * MD5 Javascript at /jquery/misc/md5.js 
 * or SHA Javascript at /jquery/misc/sha1.js
 */
(function($){
  $.fn.encrypt = function(type) {
    $(this).each(function(index, input) {
      var val = $(input).val();
      
      if(type && type == "sha") {
        $(input).val(hex_sha1(val));
      } else { //default is md5
        $(input).val(hex_md5(val));
      }
    });
  };
})(jQuery);
