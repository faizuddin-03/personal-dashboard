<script>
$(document).ready(function() {
	$("#tx-form").bind("keypress", function(e) {
           if (e.keyCode == 13) {
               return false;
           }
       });
    
	
	populateTransmissionOption(true);
	populateVariantOption(true);
	
	
		$("#quote-transactionId").val("67917b21-4b64-4f65-b5e3-3c2685c3d080");
		$("#postcode").val("31150");
		$("#postcode-row").show();
	
	
	$("#to-continue").click(function() {
		$("#quote-results").hide().html("");
		$("#to-continue").attr("disabled", "disabled");
		var transactionId = $("#transactionId").val();
		var ncdVehicleRegNo = $("#ncdVehicleRegNo").val();
		
			$.ajax({
				type: "POST",
				url: "/sit3/ajax/insurance/insurance-quote-enquiry/saveNCDVehicleNo.do",
				data: {transactionId : transactionId, ncdVehicleRegNo : ncdVehicleRegNo},
				success: function(response) {
					$("#to-continue").removeAttr("disabled");
					if($(".code", response).text() == "OK") {
						$.ajax({
							type: "POST",
							url: "/sit3/ajax/insurance/insurance-quote-enquiry/processPlanDetails.do",
							data: {transactionId : transactionId},
							success: function(response) {
								$("#quote-results").show().html(response);
							}
						});
					}else if($(".code", response).text() == "ERROR") {
						alert($(".item", response).text());
						return false;
					}
				}
			});
		
	});

	$("#transmission").change(function() {
		populateVariantOption(false);
	});

	$("#capacity").change(function() {
		populateTransmissionOption(false);
	});
});

function populateCapacity(isPopulate) {
	$("#capacity option:gt(0)").remove();
	
	populateTransmissionOption(isPopulate);
}

function populateTransmissionOption(isPopulate) {
	$("#transmission option:gt(0)").remove();
	$("#varientSeriesType option:gt(0)").remove();
	var capacity = $("#capacity :selected").val();
	if(capacity == undefined) {
		capacity = 1497.0;
	}
	
	
	populateVariantOption(isPopulate);
}

function populateVariantOption(isPopulate) {
	$("#varientSeriesType option:gt(0)").remove();
	var transmission = $("#transmission :selected").val();
	var capacity = $("#capacity :selected").val();
	if(capacity == undefined) {
		capacity = 1497.0;
	}

}
