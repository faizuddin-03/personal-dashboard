<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#1e293b"/>

  <!-- Ears -->
  <polygon points="5,13 5,3 13,10" fill="#94a3b8"/>
  <polygon points="27,13 27,3 19,10" fill="#94a3b8"/>
  <!-- Inner ears -->
  <polygon points="6.5,11.5 6.5,5.5 12,10" fill="#f472b6"/>
  <polygon points="25.5,11.5 25.5,5.5 20,10" fill="#f472b6"/>

  <!-- Head -->
  <ellipse cx="16" cy="19" rx="11" ry="10" fill="#94a3b8"/>

  <!-- Eyes -->
  <ellipse cx="12" cy="17" rx="2" ry="2.5" fill="#1e293b"/>
  <ellipse cx="20" cy="17" rx="2" ry="2.5" fill="#1e293b"/>
  <!-- Eye shine -->
  <circle cx="12.7" cy="16" r="0.7" fill="white"/>
  <circle cx="20.7" cy="16" r="0.7" fill="white"/>

  <!-- Nose -->
  <polygon points="16,20.5 14.5,19 17.5,19" fill="#f472b6"/>

  <!-- Mouth -->
  <path d="M14.5,20.5 Q16,22 17.5,20.5" fill="none" stroke="#475569" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="5" y1="19.5" x2="13" y2="20.5" stroke="#64748b" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="5" y1="21.5" x2="13" y2="21.5" stroke="#64748b" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="27" y1="19.5" x2="19" y2="20.5" stroke="#64748b" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="27" y1="21.5" x2="19" y2="21.5" stroke="#64748b" stroke-width="0.7" stroke-linecap="round"/>
</svg>
